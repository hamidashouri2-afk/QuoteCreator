<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Creator V6 فارسی</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#20252b;font:15px Tahoma,Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:360px 1fr;gap:24px}section{background:white;border-radius:14px;padding:20px}h1{font-size:22px;margin:0 0 18px}label{display:block;margin:12px 0 5px}textarea,input,select,button{font:inherit}textarea,input[type=text],select{width:100%;border:1px solid #cbd0d6;border-radius:7px;padding:10px}textarea{height:150px;resize:vertical}input[type=range]{width:100%}button{border:0;border-radius:8px;padding:12px;cursor:pointer;background:#e8ebef;color:#20252b}button.primary{background:#17664c;color:white;width:100%;margin-top:12px} .pair{display:flex;gap:12px;align-items:center}.pair>*{flex:1}input[type=color]{width:100%;height:40px;border:0;background:none}canvas{display:block;width:100%;max-width:540px;height:auto;margin:auto;box-shadow:0 4px 24px #0002}.preview{display:flex;flex-direction:column;justify-content:center;gap:12px}small{color:#626b75;line-height:1.8}#status{text-align:center} @media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}#fontGallery{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}#fontGallery button{text-align:right;border:1px solid #d5d9df;background:white;padding:8px;min-width:0}#fontGallery button[aria-pressed=true]{border:2px solid #17664c;background:#edf7f1}#fontGallery button:disabled{opacity:.55;cursor:not-allowed}.fontSample{display:block;font-size:21px;line-height:1.8}.fontMeta{display:block;font:11px Tahoma;color:#626b75}#fontNotice{display:block;margin-top:6px} 
main{max-width:1400px;height:100dvh;padding:12px;gap:12px;grid-template-columns:minmax(340px,440px) minmax(0,1fr)}section{padding:12px;min-height:0}main>section:first-child{overflow:auto}h1{font-size:18px;margin:0 0 5px}label{margin:5px 0 2px;font-size:13px}textarea{height:85px;min-height:45px}textarea,input[type=text],select{padding:5px}button{padding:6px 10px}input[type=color]{height:27px}input[type=range]{margin:0;height:17px}button.primary{margin-top:5px}small{font-size:11px;line-height:1.4}#fontSummary{display:inline-block;margin-right:6px}#font{width:58%}#openFonts{width:40%}.preview{align-items:center;justify-content:center;gap:5px;overflow:hidden}canvas{width:auto;height:auto;max-width:100%;max-height:calc(100dvh - 75px);object-fit:contain}dialog{width:min(760px,94vw);max-height:85dvh;border:1px solid #cbd0d6;border-radius:12px;padding:16px;overflow:auto}dialog::backdrop{background:#0007}.dialogHead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;padding:5px 0;z-index:1}@media(min-width:801px) and (max-height:760px){textarea{height:65px}label{margin:3px 0 1px}section{padding:9px}h1{font-size:16px}main{padding:6px;gap:8px}}@media(max-width:800px){main{height:auto;grid-template-columns:1fr}canvas{max-height:75dvh}}
dialog{overflow:hidden}#fontGallery{max-height:52dvh;overflow:auto}#fontSearch{display:block;margin:8px 0;width:100%} .dialogHead{position:static}</style><main><section><h1>پوسترساز فارسی – نسخه ۶</h1><label for="quote">متن پست</label><textarea id="quote" placeholder="متن را اینجا بنویسید…">آخرین برگ سفرنامۀ باران این است،
که زمین چرکین است...</textarea><label for="author">نام نویسنده (اختیاری)</label><input id="author" type="text" value="شفیعی کدکنی"><div class="pair"><div><label for="bg">پس‌زمینه</label><input id="bg" type="color" value="#233d36"></div><div><label for="fg">رنگ نوشته</label><input id="fg" type="color" value="#f5eee0"></div></div><button id="random" style="width:100%">ترکیب رنگ تصادفی</button><label for="font">فونت</label><select id="font"><option>Tahoma</option><option>Arial</option><option>Segoe UI</option><option>B Nazanin</option><option>Vazirmatn</option><option>IRANSans</option><option>Georgia</option><option>B Mitra</option><option>B Lotus</option><option>B Titr</option><option>Sahel</option><option>Shabnam</option><option>Samim</option><option>IRANYekan</option><option>Times New Roman</option></select><button id="openFonts" type="button">گالری فونت‌ها</button><small id="fontSummary"></small><label for="custom">افزودن مستقیم فایل فونت (مطمئن‌ترین روش)</label><input id="custom" multiple type="file" accept=".ttf,.otf,.woff,.woff2"><label for="align">چیدمان</label><select id="align"><option value="center">وسط‌چین</option><option value="right">راست‌چین</option><option value="left">چپ‌چین</option></select><label><input id="auto" type="checkbox" checked> اندازه خودکار متن</label><label>اندازه / سقف اندازه: <span id="sizev"></span></label><input id="size" type="range" min="24" max="120" value="64"><label>فاصله خطوط: <span id="leadingv"></span></label><input id="leading" type="range" min="1.1" max="2.2" step="0.05" value="1.65"><label>حاشیه امن: <span id="marginv"></span></label><input id="margin" type="range" min="70" max="220" value="120"><label><input id="bold" type="checkbox"> متن ضخیم</label><button class="primary" id="save">ذخیره تصویر PNG</button><small>ابعاد ثابت ۱۰۸۰ × ۱۳۵۰ • بدون واترمارک • آفلاین</small></section><section class="preview"><canvas id="canvas" width="1080" height="1350"></canvas><small id="status"></small></section></main><dialog id="fontDialog"><div class="dialogHead"><strong>گالری فونت‌ها</strong><button id="closeFonts" type="button">بستن ×</button></div><button id="systemFonts" type="button" style="width:100%">خواندن فونت‌های نصب‌شده ویندوز</button><small id="systemStatus"></small><input id="fontSearch" type="text" placeholder="جست‌وجوی فونت (مثلاً Vazir یا وزیر)"><div id="fontGallery"></div><small id="fontNotice" role="status"></small><button id="refreshFonts" type="button" style="width:100%;margin-top:6px">بررسی دوباره فونت‌ها</button></dialog><script>
const $=id=>document.getElementById(id), c=$('canvas'),ctx=c.getContext('2d');let customFont=null;const installed=new Set(), imported=new Set(), localFaces=new Map();const ids=['quote','author','bg','fg','font','align','auto','size','leading','margin','bold'];function font(s,b=false){return `${b?'bold ':''}${s}px "${$('font').value}", Tahoma, Arial, sans-serif`;}function wrap(t,w){return t.split('\n').flatMap(p=>{if(!p)return [''];let lines=[],line='';for(let word of p.split(/ +/)){let test=line?line+' '+word:word;if(line&&ctx.measureText(test).width>w){lines.push(line);line=word}else line=test;}lines.push(line);return lines;});}function draw(){let m=+$('margin').value, s=+$('size').value, lead=+$('leading').value,b=$('bold').checked,a=$('author').value.trim(),t=$('quote').value;let w=1080-2*m,h=1350-2*m,lines,al,as,gap,total,wide;do{ctx.font=font(s,b);lines=wrap(t,w);wide=lines.some(l=>ctx.measureText(l).width>w);as=Math.max(18,Math.round(s*.58));ctx.font=font(as);al=a?wrap(a,w):[];wide=wide||al.some(l=>ctx.measureText(l).width>w);gap=a?s*.8:0;total=lines.length*s*lead+gap+al.length*as*1.5;if(!$('auto').checked||(!wide&&total<=h)||s<=10)break;s--;}while(true);ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,1080,1350);ctx.fillStyle=$('fg').value;ctx.direction='rtl';ctx.textAlign=$('align').value;ctx.textBaseline='middle';let x=ctx.textAlign==='center'?540:ctx.textAlign==='right'?1080-m:m,y=(1350-total)/2;ctx.font=font(s,b);for(let l of lines){ctx.fillText(l,x,y+s*lead/2);y+=s*lead;}y+=gap;ctx.font=font(as);for(let l of al){ctx.fillText(l,x,y+as*.75);y+=as*1.5;}$('sizev').textContent=$('size').value;$('leadingv').textContent=lead;$('marginv').textContent=m;$('status').textContent=wide||total>h?'هشدار: متن از حاشیه امن بیرون می‌زند؛ اندازه را کاهش دهید.':`اندازه واقعی متن: ${s} پیکسل | تضاد رنگ: ${contrast($('bg').value,$('fg').value).toFixed(1)}:1`;try{localStorage.setItem('quotecreator-v4',JSON.stringify(Object.fromEntries(ids.filter(i=>true).map(i=>[i,$(i).type==='checkbox'?$(i).checked:$(i).value]))))}catch(e){}}
function lum(h){let a=h.slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*a[0]+.7152*a[1]+.0722*a[2]}function contrast(a,b){let x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}function rand(){return '#'+Math.floor(Math.random()*16777216).toString(16).padStart(6,'0')}$('random').onclick=()=>{let a,b;do{a=rand();b=rand()}while(contrast(a,b)<7);$('bg').value=a;$('fg').value=b;draw()};$('save').onclick=()=>{draw();c.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='quote-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};let saved={};try{saved=JSON.parse(localStorage.getItem('quotecreator-v4')||'{}');}catch(e){}for(let i of ids)if(i in saved&&i!=='font'){if($(i).type==='checkbox')$(i).checked=saved[i];else $(i).value=saved[i]}
function addOption(name,label=name){if(!Array.from($('font').options).some(o=>o.value===name))$('font').add(new Option(label,name));}
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('QuoteCreatorFonts',1);r.onupgradeneeded=()=>r.result.createObjectStore('fonts',{keyPath:'name'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function store(record){const d=await db();try{await new Promise((resolve,reject)=>{const t=d.transaction('fonts','readwrite');t.objectStore('fonts').put(record);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});}finally{d.close();}}
async function loadRecord(r){const face=new FontFace(r.name,r.bytes);await face.load();document.fonts.add(face);imported.add(r.name);addOption(r.name,r.label);}
$('custom').onchange=async()=>{let failures=[],temporary=[];for(const f of $('custom').files){try{const bytes=await f.arrayBuffer();const name='QC_FILE_'+Array.from(new TextEncoder().encode(f.name+'_'+f.size+'_'+f.lastModified)).map(x=>x.toString(16).padStart(2,'0')).join('');const r={name,label:f.name.replace(/\.[^.]+$/,''),bytes};await loadRecord(r);$('font').value=name;try{await store(r)}catch(e){temporary.push(f.name)}}catch(e){failures.push(f.name)}}refreshFonts();draw();if(failures.length||temporary.length)alert((failures.length?'خواندن ناموفق: '+failures.join(', ')+'\n':'')+(temporary.length?'فقط برای این نشست؛ ذخیره مرورگر ناموفق: '+temporary.join(', '):''));};
$('systemFonts').onclick=async()=>{try{if(!window.queryLocalFonts)throw Error('unsupported');const fonts=await window.queryLocalFonts();for(const f of fonts){const name=f.family;if(!localFaces.has(name)||/^(regular|normal|book)$/i.test(f.style))localFaces.set(name,f);installed.add(name);addOption(name)}$('systemStatus').textContent=`${installed.size} خانواده فونت خوانده شد.`;refreshFonts();}catch(e){$('systemStatus').textContent='دسترسی مستقیم ممکن نشد؛ فایل TTF یا OTF را وارد کنید.'}};
async function chooseFont(name){const f=localFaces.get(name)||Array.from(localFaces.values()).find(f=>f.family.toLowerCase()===name.toLowerCase());if(f){try{const alias='QC_LOCAL_'+Array.from(new TextEncoder().encode(f.postscriptName)).map(x=>x.toString(16).padStart(2,'0')).join('');if(!imported.has(alias)){const bytes=await (await f.blob()).arrayBuffer();const r={name:alias,label:f.family+' (بارگذاری مستقیم)',bytes};await loadRecord(r);try{await store(r)}catch(e){}}name=alias;}catch(e){$('systemStatus').textContent='بارگذاری مستقیم ناموفق بود؛ فایل فونت را وارد کنید.';return false;}}if(!imported.has(name)){try{const alias='QC_CSS_'+name.replace(/[^a-zA-Z0-9]/g,'_');const face=new FontFace(alias,`local(${JSON.stringify(name)})`);await face.load();document.fonts.add(face);imported.add(alias);addOption(alias,name+' (محلی)');name=alias;}catch(e){$('systemStatus').textContent='فونت محلی بارگذاری نشد؛ فایل TTF یا OTF را مستقیماً وارد کنید.';$('fontNotice').textContent=$('systemStatus').textContent;}}await document.fonts.load(`64px "${name}"`);$('font').value=name;refreshFonts();draw();return true;}
$('fontSearch').oninput=()=>refreshFonts();
async function restore(){try{const d=await db();const records=await new Promise((resolve,reject)=>{const r=d.transaction('fonts').objectStore('fonts').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});d.close();for(const r of records)try{await loadRecord(r)}catch(e){}}catch(e){}if(saved.font&&Array.from($('font').options).some(o=>o.value===saved.font))await chooseFont(saved.font);refreshFonts();draw();}
const probe=document.createElement('canvas').getContext('2d');
function differs(name, sample){return ['monospace','serif','sans-serif'].some(base=>{probe.font=`72px ${base}`;const a=probe.measureText(sample);probe.font=`72px "${name}", ${base}`;const b=probe.measureText(sample);return Math.abs(a.width-b.width)>.05||Math.abs(a.actualBoundingBoxAscent-b.actualBoundingBoxAscent)>.05||Math.abs(a.actualBoundingBoxDescent-b.actualBoundingBoxDescent)>.05;});}
const sample='زندگی زیباست؛ گچ‌پژوه';let fontStates=new Map();
function refreshFonts(){const gallery=$('fontGallery');gallery.replaceChildren();fontStates.clear();for(const opt of $('font').options){const name=opt.value;const present=imported.has(name)||installed.has(name)||differs(name,'mmmmWWii 0123456789')||differs(name,sample);const persian=present&&differs(name,sample);fontStates.set(name,{present,persian});const btn=document.createElement('button');btn.type='button';btn.dataset.font=name;btn.disabled=false;const meta=document.createElement('span');meta.className='fontMeta';meta.textContent=opt.textContent+' · '+(imported.has(name)?'فایل بارگذاری شده':!present?'تأیید نشده؛ قابل انتخاب':persian?'فارسی: احتمالاً پشتیبانی می‌شود':'فارسی: نامطمئن');const preview=document.createElement('span');preview.className='fontSample';preview.style.fontFamily=`"${name}", Tahoma, sans-serif`;preview.textContent=sample;btn.append(meta,preview);btn.onclick=async()=>{if(await chooseFont(name))$('fontDialog').close()};const q=$('fontSearch').value.trim().toLowerCase().replace('وزیر','vazir').replace('شبنم','shabnam').replace('ساحل','sahel');if(opt.textContent.toLowerCase().includes(q))gallery.append(btn);}updateFontNotice();}
function updateFontNotice(){const name=$('font').value;const state=fontStates.get(name);for(const b of $('fontGallery').children)b.setAttribute('aria-pressed',String(b.dataset.font===name));$('fontSummary').textContent=imported.has(name)?'✓ فونت بارگذاری شده':!state?.present?'⚠ تأیید نشده':!state.persian?'⚠ فارسی نامطمئن':'✓ شناسایی شد';$('fontNotice').textContent=!state?.present?'⚠ فونت انتخابی تأیید نشده؛ می‌توانید آن را امتحان کنید یا فایل فونت را وارد کنید.':!state.persian?'⚠ پشتیبانی فارسی این فونت تأیید نشد؛ ممکن است حروف فارسی با فونت جایگزین نمایش داده شوند.':'فونت شناسایی شد؛ پشتیبانی فارسی بر اساس اندازه‌گیری تقریبی است.';}
$('openFonts').onclick=()=>{refreshFonts();$('fontDialog').showModal();$('fontSearch').focus()};$('closeFonts').onclick=()=>$('fontDialog').close();$('fontDialog').addEventListener('click',e=>{if(e.target===$('fontDialog'))$('fontDialog').close()});$('refreshFonts').onclick=()=>{refreshFonts();draw()};$('font').addEventListener('change',()=>chooseFont($('font').value).catch(e=>{$('fontSummary').textContent='خطای بارگذاری: '+e.message}));$('font').addEventListener('input',updateFontNotice);for(let i of ids)$(i).addEventListener('input',draw);refreshFonts();document.fonts.ready.then(()=>{refreshFonts();draw()});restore();</script></html>
